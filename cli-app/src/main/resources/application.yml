server:
  port: 9119
  servlet:
    context-path: /api/cli

spring:
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    dynamic:
      primary: master  # 设置默认的数据源或者数据源组，默认值即为master
      strict: false # 严格匹配数据源，默认false。true：未匹配到指定数据源时抛异常，false：使用默认数据源
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/cli_demo?useUnicode=true&characterEncoding=utf-8&useSSL=false
          username: root
          password: gang8579
          driver-class-name: com.mysql.cj.jdbc.Driver
          druid:
            initial-size: 10
            max-active: 30
            min-idle: 5
            max-wait: 60000
  data:
    mongodb:
      uri: mongodb://root:W_s4I1bUiKpPI5vG@127.0.0.1:27017/cli_demo?authSource=admin&connectTimeoutMS=30000&socketTimeoutMS=120000&maxWaitTimeMS=30000&maxPoolSize=100
      auto-index-creation: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
  task:
